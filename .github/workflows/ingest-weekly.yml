name: Ingest weekly projections & actuals

# Captures RotoWire feeds into committed per-week snapshot CSVs (data/).
#
# Runs DAILY during the season and ingests BOTH projections and actuals:
#  - Projections: RotoWire revises a week's Floor/Median/Ceiling as injuries and
#    other context land up to kickoff, so we re-pull daily and replace the
#    current week's snapshot whenever it changes (a no-op when it doesn't). It
#    targets the upcoming/in-progress week and rolls forward once games finish,
#    freezing the completed week's snapshot at its last pre-game state.
#  - Actuals: re-pulled daily too, so results appear as games complete through
#    the week (the stats feed returns whatever games have finished). Each run
#    targets the just-completed / in-progress week.
#
# Auto week/season resolution is a date heuristic; use the manual "Run workflow"
# button with an explicit week for backfills or anything that must be exact.

on:
  schedule:
    # Daily 13:00 UTC ≈ 09:00 ET — after overnight injury news / stat
    # corrections, before kickoffs (Sunday's earliest is ~17:00 UTC). Months
    # gated to the season (Sep–Feb) to avoid off-season runs.
    - cron: "0 13 * 9-12,1-2 *" # daily — refresh projections + capture actuals
  workflow_dispatch:
    inputs:
      season:
        description: "Season (year), e.g. 2025. Blank = auto by date."
        required: false
      week:
        description: "NFL week number. Blank = auto by date."
        required: false
      only:
        description: "What to ingest"
        required: false
        default: "both"
        type: choice
        options: [both, projections, actuals]
      force:
        description: "Bypass the rollover guard (allow a smaller set to replace a larger one)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ingest-weekly
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Scheduled runs ingest both; manual runs honor the chosen mode.
      - name: Resolve ingest mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "only=both" >> "$GITHUB_OUTPUT"
          else
            echo "only=${{ github.event.inputs.only || 'both' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Ingest
        env:
          ROTOWIRE_COOKIE: ${{ secrets.ROTOWIRE_COOKIE }}
          SEASON: ${{ github.event.inputs.season }}
          WEEK: ${{ github.event.inputs.week }}
        run: |
          args="--only ${{ steps.mode.outputs.only }}"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then args="$args --force"; fi
          echo "Running: node scripts/ingest.mjs $args"
          node scripts/ingest.mjs $args

      # Grade any paper bets whose actuals just landed above. Safe to run even
      # when --only projections was chosen (it just finds nothing new to grade).
      - name: Grade pending bets
        if: always()
        run: node scripts/grade-bets.mjs

      # Always commit whatever was written, even if one artifact failed (e.g. a
      # feed error or an empty in-week actuals pull).
      - name: Commit snapshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No new snapshots to commit."
          else
            git commit -m "Ingest snapshots (${{ steps.mode.outputs.only }}) [skip ci]"
            git push
          fi
