name: Publish weekly edges (Tuesday drop)

# THE DROP. Captures OpticOdds prop lines, prices them against our own
# Floor/Median/Ceiling projections, and publishes every qualifying edge to
# data/edges/. That published set is the product — what a subscriber would
# receive Tuesday morning.
#
# It then replays every simulated bettor (scripts/simulate-personas.mjs) over
# the season's edges to regenerate data/bets/{persona}/. Ledgers are rebuilt
# from scratch every run rather than graded incrementally, so a persona rule
# change is just a re-run.
#
# Requires the OPTICODDS_API_KEY secret. Without it the capture step fails
# fast rather than silently writing an empty ledger.
#
# Runs weekly, Wednesday morning, once that week's projections snapshot
# exists (scripts/ingest.mjs runs daily and produces it). Grading happens
# separately, daily, in ingest-weekly.yml as actuals land.

on:
  schedule:
    # Tuesday 13:00 UTC ≈ 09:00 ET. Tuesday morning is the simulated drop
    # time: the week's lines are up, and it is early enough that a subscriber
    # acting on the edges would still find them. It is also the SOFTEST point
    # of the week — which is exactly why closing-line value is captured
    # separately and reported alongside ROI.
    - cron: "0 13 * 9-12,1-2 2"
  workflow_dispatch:
    inputs:
      season:
        description: "Season (year), e.g. 2025. Blank = auto by date."
        required: false
      week:
        description: "NFL week number. Blank = auto by date."
        required: false
      minEdge:
        description: "Minimum edge to place a paper bet, e.g. 0.03"
        required: false
        default: "0.03"
      edgeBasis:
        description: "ev (profitability, default) or novig (model disagreement — research only)"
        required: false
        default: "ev"
      sides:
        description: "both | over | under"
        required: false
        default: "both"
      historical:
        description: "Pull historical lines for a week already played (true/false)"
        required: false
        default: "false"
      includeOffshore:
        description: "Also pull offshore books, e.g. Pinnacle (true/false)"
        required: false
        default: "false"
      dryRun:
        description: "Fetch and price but write nothing — use this for the first run (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: props-weekly
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Capture props
        env:
          OPTICODDS_API_KEY: ${{ secrets.OPTICODDS_API_KEY }}
          SEASON: ${{ github.event.inputs.season }}
          WEEK: ${{ github.event.inputs.week }}
        run: |
          if [ -z "$OPTICODDS_API_KEY" ]; then
            echo "::error::OPTICODDS_API_KEY secret is not set — odds cannot be captured."
            exit 1
          fi
          args=""
          if [ -n "${{ github.event.inputs.season }}" ]; then args="$args --season ${{ github.event.inputs.season }}"; fi
          if [ -n "${{ github.event.inputs.week }}" ]; then args="$args --week ${{ github.event.inputs.week }}"; fi
          if [ -n "${{ github.event.inputs.minEdge }}" ]; then args="$args --min-edge ${{ github.event.inputs.minEdge }}"; fi
          if [ -n "${{ github.event.inputs.edgeBasis }}" ]; then args="$args --edge-basis ${{ github.event.inputs.edgeBasis }}"; fi
          if [ -n "${{ github.event.inputs.sides }}" ]; then args="$args --sides ${{ github.event.inputs.sides }}"; fi
          if [ "${{ github.event.inputs.historical }}" = "true" ]; then args="$args --historical"; fi
          if [ "${{ github.event.inputs.includeOffshore }}" = "true" ]; then args="$args --include-offshore"; fi
          if [ "${{ github.event.inputs.dryRun }}" = "true" ]; then args="$args --dry-run"; fi
          echo "Running: node scripts/capture-props.mjs $args"
          node scripts/capture-props.mjs $args

      # Regenerate every persona ledger from the full season of edges. Cheap,
      # deterministic, and picks up results that landed since the last run.
      - name: Replay personas
        if: always() && github.event.inputs.dryRun != 'true'
        run: node scripts/simulate-personas.mjs

      - name: Commit snapshots
        if: always() && github.event.inputs.dryRun != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No new props/bets to commit."
          else
            git commit -m "Publish weekly edges + replay personas [skip ci]"
            git push
          fi
