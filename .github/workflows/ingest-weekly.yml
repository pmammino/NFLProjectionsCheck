name: Ingest weekly projections & actuals

# Captures RotoWire feeds into committed per-week snapshot CSVs (data/).
#
# Projections refresh DAILY: RotoWire keeps updating a week's Floor/Median/
# Ceiling as injuries and other context land right up to kickoff, so we re-pull
# every day and replace the current week's snapshot whenever the numbers change
# (a no-op when they don't). The projection endpoints only serve the current
# season, so the daily run targets the upcoming/in-progress week and rolls to the
# next week once games finish — a finished week's snapshot then stays frozen at
# its last pre-game state.
#
# Actuals run weekly (Tuesday) after Monday night + overnight stat corrections.
#
# Auto week/season resolution is a date heuristic; use the manual "Run workflow"
# button with an explicit week for backfills or anything that must be exact.

on:
  schedule:
    # Times are UTC; months gated to the season (Sep–Feb) to avoid off-season
    # runs. Daily 13:00 UTC ≈ 09:00 ET — after overnight injury news, before
    # kickoffs (Sunday's earliest is ~17:00 UTC).
    - cron: "0 13 * 9-12,1-2 *" # daily — refresh the current week's projections
    # Tue 15:00 UTC ≈ 11:00 ET, after Monday night + overnight stat corrections.
    - cron: "0 15 * 9-12,1-2 2" # Tuesday — actuals for the completed week
  workflow_dispatch:
    inputs:
      season:
        description: "Season (year), e.g. 2025. Blank = auto by date."
        required: false
      week:
        description: "NFL week number. Blank = auto by date."
        required: false
      only:
        description: "What to ingest"
        required: false
        default: "both"
        type: choice
        options: [both, projections, actuals]
      force:
        description: "Bypass the rollover guard (allow a smaller set to replace a larger one)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ingest-weekly
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Scheduled runs pick the pass from the cron that fired: the Tuesday cron →
      # actuals, the daily cron → projections. Manual runs use the chosen inputs.
      - name: Resolve ingest mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 15 * 9-12,1-2 2" ]; then
              echo "only=actuals" >> "$GITHUB_OUTPUT"
            else
              echo "only=projections" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "only=${{ github.event.inputs.only || 'both' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Ingest
        env:
          ROTOWIRE_COOKIE: ${{ secrets.ROTOWIRE_COOKIE }}
          SEASON: ${{ github.event.inputs.season }}
          WEEK: ${{ github.event.inputs.week }}
        run: |
          args="--only ${{ steps.mode.outputs.only }}"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then args="$args --force"; fi
          echo "Running: node scripts/ingest.mjs $args"
          node scripts/ingest.mjs $args

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No new snapshots to commit."
          else
            git commit -m "Ingest snapshots (${{ steps.mode.outputs.only }}) [skip ci]"
            git push
          fi
